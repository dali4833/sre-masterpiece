# Default values for canary-app
namespace: default

serviceA:
  image: localhost:5000/service-a
  tag: v1
  port: 8080
  replicas: 2

serviceB:
  image: localhost:5000/service-b
  tag: v1
  port: 8081
  replicas: 2

istio:
  enabled: true
  gateway: canary-gateway
  mtlsMode: STRICT

canary:
  enabled: true
  steps:
    - setWeight: 10
    - pause: { duration: 2m }
    - setWeight: 30
    - pause: { duration: 2m }
    - setWeight: 50
    - pause: { duration: 2m }
    - setWeight: 100

analysis:
  successRate: 99
  p99Latency: 300
  interval: 30s
  count: 4
