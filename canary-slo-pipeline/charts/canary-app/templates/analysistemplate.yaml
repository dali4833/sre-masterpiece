apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: canary-analysis
  namespace: {{ .Values.namespace }}
spec:
  args:
  - name: service-name
  metrics:
  - name: success-rate
    interval: 30s
    count: 3
    successCondition: result[0] >= 99
    failureLimit: 2
    provider:
      prometheus:
        address: http://prometheus-server.monitoring.svc.cluster.local
        query: |
          sum(rate(istio_requests_total{reporter="source",destination_service_name=~"{{ "{{args.service-name}}" }}",response_code!~"5.*"}[1m])) 
          / 
          sum(rate(istio_requests_total{reporter="source",destination_service_name=~"{{ "{{args.service-name}}" }}"}[1m])) * 100
  - name: p99-latency
    interval: 30s
    count: 3
    successCondition: result[0] <= 300
    failureLimit: 2
    provider:
      prometheus:
        address: http://prometheus-server.monitoring.svc.cluster.local
        query: |
          histogram_quantile(0.99, 
            sum(rate(istio_request_duration_milliseconds_bucket{reporter="source",destination_service_name=~"{{ "{{args.service-name}}" }}"}[1m])) by (le)
          )
