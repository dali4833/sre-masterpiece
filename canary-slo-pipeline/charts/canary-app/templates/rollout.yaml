apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ .Release.Name }}-service-a
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.serviceA.replicas }}
  selector:
    matchLabels:
      app: service-a
  template:
    metadata:
      labels:
        app: service-a
        version: {{ .Values.serviceA.tag }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.serviceA.port }}"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: service-a
        image: {{ .Values.serviceA.image }}:{{ .Values.serviceA.tag }}
        ports:
        - containerPort: {{ .Values.serviceA.port }}
        env:
        - name: APP_VERSION
          value: {{ .Values.serviceA.tag | quote }}
        - name: SERVICE_B_URL
          value: "http://{{ .Release.Name }}-service-b-stable:{{ .Values.serviceB.port }}"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.serviceA.port }}
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.serviceA.port }}
          initialDelaySeconds: 15
          periodSeconds: 20
  strategy:
    canary:
      canaryService: {{ .Release.Name }}-service-a-canary
      stableService: {{ .Release.Name }}-service-a-stable
      trafficRouting:
        istio:
          virtualService:
            name: {{ .Release.Name }}-service-a-vs
            routes:
            - http
      steps:
      - setWeight: 10
      - analysis:
          templates:
          - templateName: canary-analysis
          args:
          - name: service-name
            value: {{ .Release.Name }}-service-a-stable
      - pause: { duration: 1m }
      - setWeight: 30
      - analysis:
          templates:
          - templateName: canary-analysis
          args:
          - name: service-name
            value: {{ .Release.Name }}-service-a-stable
      - pause: { duration: 1m }
      - setWeight: 50
      - analysis:
          templates:
          - templateName: canary-analysis
          args:
          - name: service-name
            value: {{ .Release.Name }}-service-a-stable
      - pause: { duration: 1m }
      - setWeight: 100
---
