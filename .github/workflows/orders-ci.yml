name: Orders CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'local-dev/sock-shop/src/orders/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/orders

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Build with Maven
        run: |
          cd local-dev/sock-shop/src/orders
          mvn clean package -DskipTests
          echo "=== JAR files ==="
          find target -name "*.jar" -type f

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: local-dev/sock-shop/src/orders
          file: local-dev/sock-shop/src/orders/docker/orders/Dockerfile.github
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Update manifest
        run: |
          cd local-dev/kubernetes/sock-shop/manifests
          sed -i "s|image: weaveworksdemos/orders:.*|image: ghcr.io/${{ github.repository }}/orders:${{ github.sha }}|g" orders-dep.yaml

      - name: Commit and push manifest update
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add orders-dep.yaml
          git commit -m "Update orders image to ${{ github.sha }}"
          git push
