name: Shipping CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'local-dev/sock-shop/src/shipping/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/shipping

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          ghcr.io/${{ github.repository }}/shipping:v1.0.0
          distribution: 'temurin'
          java-version: '8'

      - name: Build with Maven
        run: |
          cd local-dev/sock-shop/src/shipping
          mvn clean package -DskipTests
          find target -name "*.jar" -type f
          # Copy JAR to docker context
          cp target/*.jar docker/shipping/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          ghcr.io/${{ github.repository }}/shipping:v1.0.0
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          ghcr.io/${{ github.repository }}/shipping:v1.0.0
          context: local-dev/sock-shop/src/shipping/docker/shipping
          push: true
      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Update manifest
        run: |
          cd local-dev/kubernetes/sock-shop/manifests
          sed -i "s|image: weaveworksdemos/shipping:.*|image: ghcr.io/${{ github.repository }}/shipping:${{ github.sha }}|g" shipping-dep.yaml

      - name: Commit and push manifest update
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add local-dev/kubernetes/sock-shop/manifests/shipping-dep.yaml
          git commit -m "Update shipping image to ${{ github.sha }}"
          git push
