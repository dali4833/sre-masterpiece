name: Queue-Master CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'local-dev/sock-shop/src/queue-master/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/queue-master

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          ghcr.io/${{ github.repository }}/queue-master:v1.0.0
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          ghcr.io/${{ github.repository }}/queue-master:v1.0.0
          context: local-dev/sock-shop/src/queue-master
          push: true
      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Update manifest
        run: |
          cd local-dev/kubernetes/sock-shop/manifests
          sed -i "s|image: weaveworksdemos/queue-master:.*|image: ghcr.io/${{ github.repository }}/queue-master:${{ github.sha }}|g" queue-master-dep.yaml

      - name: Commit and push manifest update
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add local-dev/kubernetes/sock-shop/manifests/queue-master-dep.yaml
          git commit -m "Update queue-master image to ${{ github.sha }}"
          git push
