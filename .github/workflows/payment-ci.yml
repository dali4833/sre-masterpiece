name: Payment CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'local-dev/sock-shop/src/payment/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/payment

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: local-dev/sock-shop/src/payment/docker/payment
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Update manifest
        run: |
          cd local-dev/kubernetes/sock-shop/manifests
          sed -i "s|image: weaveworksdemos/payment:.*|image: ghcr.io/${{ github.repository }}/payment:${{ github.sha }}|g" payment-dep.yaml

      - name: Commit and push manifest update
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add local-dev/kubernetes/sock-shop/manifests/payment-dep.yaml
          git commit -m "Update payment image to ${{ github.sha }}"
          git push
